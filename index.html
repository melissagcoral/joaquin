<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Invitación digital al cumpleaños de Joaquín. Te esperamos para celebrar sus 15 años con una noche épica." />
    <title>Invitación · Joaquín Ozorio Sevila</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Rajdhani:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --silver: #a8a8a8;
            --silver-light: #c0c0c0;
            --silver-dark: #6a6a6a;
            --grad-silver: linear-gradient(135deg, #888, #c0c0c0, #787878);
            --grad-header: linear-gradient(160deg, #0e0e0e, #252525, #0e0e0e);
            --shadow: 0 8px 32px rgba(0, 0, 0, .7);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(160deg, #0a0a0a 0%, #1a1a1a 60%, #0d0d0d 100%);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: var(--silver-light);
            overflow: hidden;
        }

        /* ── GLOBOS ── */
        .balloons-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 0;
            }

            6% {
                opacity: var(--op, .7);
            }

            88% {
                opacity: var(--op, .7);
            }

            100% {
                transform: translateX(var(--drift)) translateY(-110vh);
                opacity: 0;
            }
        }

        /* ── ANIMACIONES ── */
        @keyframes shimmer {
            from {
                background-position: -200% center;
            }

            to {
                background-position: 200% center;
            }
        }

        @keyframes glow {

            0%,
            100% {
                text-shadow: 0 0 8px rgba(192, 192, 192, .35);
            }

            50% {
                text-shadow: 0 0 20px rgba(192, 192, 192, .75), 0 0 40px rgba(192, 192, 192, .3);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-wa {

            0%,
            100% {
                box-shadow: 0 0 12px rgba(37, 211, 102, .45);
            }

            50% {
                box-shadow: 0 0 24px rgba(37, 211, 102, .8);
            }
        }

        @keyframes pulse-map {

            0%,
            100% {
                box-shadow: 0 0 12px rgba(192, 192, 192, .25);
            }

            50% {
                box-shadow: 0 0 24px rgba(192, 192, 192, .55);
            }
        }

        /* ── CARD ── */
        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            background: rgba(8, 8, 8, .88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 22px;
            border: 1px solid rgba(192, 192, 192, .22);
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: slideIn .7s ease-out;
        }

        /* ── HEADER ── */
        .header {
            background: var(--grad-header);
            padding: 14px 20px 11px;
            text-align: center;
            border-bottom: 1px solid rgba(192, 192, 192, .2);
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--silver-light);
            animation: glow 3s ease-in-out infinite;
            line-height: 1.2;
        }

        .header h2 {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: .95rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin-top: 4px;
            background: var(--grad-silver);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        /* ── HERO 15 ── */
        .hero {
            text-align: center;
            padding: 16px 20px 10px;
        }

        .num {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            background: var(--grad-silver);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
            display: block;
        }

        .anos {
            font-family: 'Cinzel', serif;
            font-size: .7rem;
            letter-spacing: .5em;
            color: var(--silver-dark);
            text-transform: uppercase;
            display: block;
            margin-top: -4px;
        }

        .hero-sub {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: .95rem;
            color: var(--silver-dark);
            margin-top: 6px;
            letter-spacing: .05em;
        }

        /* ── DIVIDER ── */
        .divider {
            height: 1px;
            margin: 0 18px;
            background: linear-gradient(90deg, transparent, rgba(192, 192, 192, .3), transparent);
        }

        /* ── INFO CHIPS ── */
        .info-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 10px 14px 8px;
        }

        .info-chip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: rgba(192, 192, 192, .07);
            border: 1px solid rgba(192, 192, 192, .18);
            border-radius: 9px;
            padding: 6px 8px;
            font-size: .82rem;
            font-weight: 500;
            color: var(--silver-light);
            letter-spacing: .3px;
            text-align: center;
        }

        .info-chip .icon {
            font-size: .9rem;
            flex-shrink: 0;
        }

        /* ── COUNTDOWN ── */
        .countdown {
            margin: 0 14px 6px;
            background: rgba(192, 192, 192, .06);
            border: 1px solid rgba(192, 192, 192, .22);
            border-radius: 12px;
            padding: 9px 14px;
            text-align: center;
        }

        .countdown-label {
            font-family: 'Cinzel', serif;
            font-size: .65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--silver-dark);
            margin-bottom: 5px;
        }

        .timer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
        }

        .timer-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timer-number {
            font-family: 'Cinzel', serif;
            font-size: 1.55rem;
            font-weight: 700;
            line-height: 1;
            background: var(--grad-silver);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        .timer-label {
            font-size: .6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--silver-dark);
            margin-top: 3px;
        }

        /* ── ACTIONS ── */
        .actions {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 6px 18px 12px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            color: var(--silver);
            font-size: .75rem;
            letter-spacing: .5px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
            transition: color .2s;
        }

        .action-btn:hover {
            color: var(--silver-light);
        }

        .action-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .2s, box-shadow .2s;
        }

        .action-btn:hover .action-icon {
            transform: scale(1.08);
        }

        .action-icon.wa {
            background: linear-gradient(135deg, #1da851, #25d366);
            animation: pulse-wa 2.5s ease-in-out infinite;
        }

        .action-icon.maps {
            background: linear-gradient(135deg, #2e2e2e, #4a4a4a);
            border: 1px solid rgba(192, 192, 192, .35);
            animation: pulse-map 2.5s ease-in-out infinite;
        }

        /* ── FOOTER ── */
        .footer {
            text-align: center;
            padding: 7px 16px 10px;
            border-top: 1px solid rgba(192, 192, 192, .1);
            font-size: .6rem;
            color: var(--silver-dark);
            line-height: 1.4;
        }

        .footer a {
            color: var(--silver);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

        const container = document.getElementById('balloons');

        function makeImgBalloon(src, minW, maxW, preplace) {
            const el = document.createElement('div');
            el.className = 'balloon';
            const w = minW + Math.random() * (maxW - minW);
            const opacity = 0.82 + Math.random() * 0.16;
            const dur = 16 + Math.random() * 14;
            const left = Math.random() * 100;
            const drift = (Math.random() - .5) * 160;
            const tilt = (Math.random() - .5) * 18;
            const negDelay = preplace ? -(Math.random() * dur * .85) : (Math.random() * 3);
            el.style.cssText = `left:${left}%;bottom:-220px;--drift:${drift}px;--op:${opacity};animation-duration:${dur}s;animation-delay:${negDelay}s;transform:rotate(${tilt}deg);`;
            const img = document.createElement('img');
            img.src = src;
            img.width = w;
            img.style.cssText = `display:block;opacity:${opacity};`;
            el.appendChild(img);
            container.appendChild(el);
        }

        // 14 globos redondos + 5 estrellas
        for (let i = 0; i < 14; i++) makeImgBalloon(BALLOON_SRC, 70, 130, i < 10);
        for (let i = 0; i < 5; i++)  makeImgBalloon(STAR_SRC, 75, 120, i < 3);
