<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Invitación digital al cumpleaños de Joaquín. Te esperamos para celebrar sus 15 años con una noche épica." />
    <title>Invitación - Joaquín Ozorio Sevila</title>

    <link rel="icon" type="image/svg+xml"  href="./assets/favicon.svg" />
    <link rel="icon" type="image/x-icon"   href="./assets/favicon.ico" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Rajdhani:wght@400;500;600&display=swap"
        rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --silver: #a8a8a8;
            --silver-light: #c0c0c0;
            --silver-dark: #6a6a6a;
            --grad-silver: linear-gradient(135deg, #888, #c0c0c0, #787878);
            --grad-header: linear-gradient(160deg, #0e0e0e, #252525, #0e0e0e);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(160deg, #0a0a0a 0%, #1a1a1a 60%, #0d0d0d 100%);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: var(--silver-light);
            overflow: hidden;
        }

        /* ── ANIMACIONES ─────────────────────── */
        @keyframes shimmer {
            from {
                background-position: -200% center;
            }

            to {
                background-position: 200% center;
            }
        }

        @keyframes glow {

            0%,
            100% {
                text-shadow: 0 0 8px rgba(192, 192, 192, .35);
            }

            50% {
                text-shadow: 0 0 20px rgba(192, 192, 192, .75), 0 0 40px rgba(192, 192, 192, .3);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-14px);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-wa {

            0%,
            100% {
                box-shadow: 0 0 12px rgba(37, 211, 102, .45);
            }

            50% {
                box-shadow: 0 0 24px rgba(37, 211, 102, .8);
            }
        }

        @keyframes pulse-map {

            0%,
            100% {
                box-shadow: 0 0 12px rgba(192, 192, 192, .25);
            }

            50% {
                box-shadow: 0 0 24px rgba(192, 192, 192, .55);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── ESTRELLAS FIJAS (fondo) ────────── */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            font-size: 18px;
            opacity: .4;
            animation: float 6s ease-in-out infinite;
        }

        .star:nth-child(1) {
            top: 8%;
            left: 7%;
            animation-delay: 0s;
        }

        .star:nth-child(2) {
            top: 18%;
            right: 9%;
            animation-delay: 1.2s;
        }

        .star:nth-child(3) {
            top: 52%;
            left: 4%;
            animation-delay: 2.4s;
        }

        .star:nth-child(4) {
            bottom: 16%;
            right: 6%;
            animation-delay: 3.6s;
        }

        .star:nth-child(5) {
            top: 38%;
            left: 83%;
            animation-delay: 4.8s;
        }

        /* ── CARD PRINCIPAL ─────────────────── */
        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background-image: url("assets/container-bg.png");
            background-size: cover;
            background-position: center;
            border-radius: 22px;
            border: 1px solid rgba(192, 192, 192, .22);
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: slideIn .7s ease-out;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(8, 8, 8, .84);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 0;
        }

        .card>* {
            position: relative;
            z-index: 1;
        }

        /* ── HEADER ─────────────────────────── */
        .header {
            background: var(--grad-header);
            padding: 14px 20px 12px;
            text-align: center;
            border-bottom: 1px solid rgba(192, 192, 192, .2);
        }

        .header .crown {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 6px;
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--silver-light);
            animation: glow 3s ease-in-out infinite;
            line-height: 1.2;
        }

        .header h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 3px;
            margin-top: 5px;
            text-transform: uppercase;
            background: var(--grad-silver);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        /* ── FOTO + 15 ──────────────────────── */
        .hero {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 22px 14px;
        }

        .hero-img {
            width: 115px;
            height: 115px;
            object-fit: cover;
            border-radius: 14px;
            cursor: pointer;
            border: 1px solid rgba(192, 192, 192, .3);
            box-shadow: 0 0 20px rgba(192, 192, 192, .15);
            flex-shrink: 0;
            transition: box-shadow .3s;
        }

        .hero-img:hover {
            box-shadow: 0 0 35px rgba(192, 192, 192, .45);
        }

        .hero-text {
            flex: 1;
        }

        .hero-text .num {
            font-family: 'Cinzel', serif;
            font-size: 3.6rem;
            font-weight: 900;
            line-height: 1;
            background: var(--grad-silver);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
            display: block;
        }

        .hero-text .anos {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            letter-spacing: 5px;
            color: var(--silver);
            text-transform: uppercase;
            margin-top: 0;
            display: block;
        }

        .hero-hint {
            font-size: .8rem;
            color: var(--silver-dark);
            margin-top: 6px;
            display: block;
            line-height: 1.4;
        }

        .hero.centered {
            justify-content: center;
            text-align: center;
            padding: 12px 20px 8px;
        }

        .hero-text.centered {
            width: 100%;
        }

        .hero-subtitle {
            display: block;
            margin-top: 4px;
            color: var(--silver);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: .75rem;
        }


        /* ── DIVISOR ────────────────────────── */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(192, 192, 192, .4), transparent);
            margin: 0 20px;
        }

        /* ── INFO EVENTO ────────────────────── */
        .info-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 10px 18px;
        }

        .info-chip {
            display: flex;
            align-items: center;
            gap: 9px;
            background: rgba(192, 192, 192, .07);
            border: 1px solid rgba(192, 192, 192, .18);
            border-radius: 9px;
            padding: 6px 12px;
            font-size: .88rem;
            font-weight: 500;
            color: var(--silver-light);
            letter-spacing: .3px;
        }

        .info-chip .icon {
            font-size: 1rem;
            flex-shrink: 0;
        }

        /* ── COUNTDOWN ──────────────────────── */
        .countdown {
            margin: 0 18px 8px;
            background: rgba(192, 192, 192, .06);
            border: 1px solid rgba(192, 192, 192, .22);
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
        }

        .countdown-label {
            font-family: 'Cinzel', serif;
            font-size: .7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--silver-dark);
            margin-bottom: 5px;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .timer-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timer-number {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1;
            background: var(--grad-silver);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        .timer-label {
            font-size: .62rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--silver-dark);
            margin-top: 3px;
        }

        /* ── ACCIONES (iconos) ──────────────── */
        .actions {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 6px 18px 12px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--silver);
            font-size: .75rem;
            letter-spacing: .5px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
            transition: color .2s;
        }

        .action-btn:hover {
            color: var(--silver-light);
        }

        .action-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .2s, box-shadow .2s;
        }

        .action-btn:hover .action-icon {
            transform: scale(1.08);
        }

        .action-icon.wa {
            background: linear-gradient(135deg, #1da851, #25d366);
            animation: pulse-wa 2.5s ease-in-out infinite;
        }

        .action-icon.maps {
            background: linear-gradient(135deg, #2e2e2e, #4a4a4a);
            border: 1px solid rgba(192, 192, 192, .35);
            animation: pulse-map 2.5s ease-in-out infinite;
        }

        /* ── FOOTER ─────────────────────────── */
        .footer {
            text-align: center;
            padding: 7px 16px 10px;
            border-top: 1px solid rgba(192, 192, 192, .1);
            font-size: .62rem;
            color: var(--silver-dark);
            line-height: 1.4;
        }

        .footer a {
            color: var(--silver);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="stars">
        <div class="star">⭐</div>
        <div class="star">✨</div>
        <div class="star">👑</div>
        <div class="star">💫</div>

            <div class="info-chip"><span class="icon">📍</span> <strong>Patrimonio Resto Bar</strong></div>
            <div class="info-chip"><span class="icon">👔</span> <strong>Sport Elegante</strong></div>
        </div>

        <!-- COUNTDOWN -->
        <div class="countdown">
            <p class="countdown-label">⏱ Cuenta regresiva</p>
            <div class="timer" id="timer">Cargando...</div>
        </div>

        <!-- ACCIONES -->
        <div class="actions">
            <a class="action-btn"
                href="https://wa.me/59593569100?text=Hola%2C%20%C2%A1Confirmo%20mi%20asistencia%20al%20cumple%20de%20Joaquín!"
                target="_blank">
                <div class="action-icon wa">

            <a class="action-btn" href="https://maps.google.com/?q=Patrimonio+Resto+Bar+Areguá+Paraguay"
                target="_blank">
                <div class="action-icon maps">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none"
                        stroke="#c0c0c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        </div>

        <!-- FOOTER -->
        <div class="footer">
            Hecho con 🖤 por
            <a href="https://www.instagram.com/invitta.py/" target="_blank">© invitta.py</a>
            &nbsp;·&nbsp;
            <a href="https://wa.me/595981172777" target="_blank">+595 981 172 777</a>
        </div>

    </div>

    <script>
        const eventDate = new Date("2026-06-05T20:00:00-03:00").getTime();
        const timerEl = document.getElementById("timer");

        setInterval(() => {
            const diff = eventDate - Date.now();
            if (diff <= 0) {
                timerEl.innerHTML = "<span style='font-family:Cinzel;font-size:1.1rem;'>¡Es hoy! 🎉</span>";
                return;
            }
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff / 3600000) % 24);
            const m = Math.floor((diff / 60000) % 60);
            const s = Math.floor((diff / 1000) % 60);
            timerEl.innerHTML = `
                <div class="timer-block"><span class="timer-number">${String(d).padStart(2, '0')}</span><span class="timer-label">días</span></div>
                <div class="timer-block"><span class="timer-number">${String(h).padStart(2, '0')}</span><span class="timer-label">hs</span></div>
                <div class="timer-block"><span class="timer-number">${String(m).padStart(2, '0')}</span><span class="timer-label">min</span></div>
                <div class="timer-block"><span class="timer-number">${String(s).padStart(2, '0')}</span><span class="timer-label">seg</span></div>
            `;
        }, 1000);

    </script>

</body>

</html>
