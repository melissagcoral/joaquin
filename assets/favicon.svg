<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="c">
      <circle cx="16" cy="17" r="13.5"/>
    </clipPath>

    <!-- Mosaicos espejados: 2×2 con tonos plata alternados -->
    <pattern id="t" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="0.3" y="0.3" width="2.5" height="2.5" fill="#c8c8c8" rx="0.3"/>
      <rect x="3.3" y="0.3" width="2.5" height="2.5" fill="#707070" rx="0.3"/>
      <rect x="0.3" y="3.3" width="2.5" height="2.5" fill="#9a9a9a" rx="0.3"/>
      <rect x="3.3" y="3.3" width="2.5" height="2.5" fill="#b8b8b8" rx="0.3"/>
    </pattern>

    <!-- Sombreado esférico: claro arriba-izq, oscuro abajo-der -->
    <radialGradient id="shade" cx="37%" cy="28%" r="78%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.32)"/>
      <stop offset="38%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.80)"/>
    </radialGradient>
  </defs>

  <!-- Hilo superior -->
  <line x1="16" y1="0.5" x2="16" y2="3.5" stroke="#888" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Fondo oscuro de la bola -->
  <circle cx="16" cy="17" r="13.5" fill="#0c0c0c"/>

  <!-- Mosaicos clipeados a la esfera -->
  <rect x="0" y="0" width="32" height="32" fill="url(#t)" clip-path="url(#c)"/>

  <!-- Sombreado esférico encima -->
  <circle cx="16" cy="17" r="13.5" fill="url(#shade)"/>

  <!-- Reflejo suave principal -->
  <ellipse cx="11.5" cy="11" rx="3.8" ry="2.6" fill="white" opacity="0.38"/>

  <!-- Destellos dispersos -->
  <circle cx="24"  cy="10" r="1.2" fill="white" opacity="0.90"/>
  <circle cx="7"   cy="16" r="1.0" fill="white" opacity="0.65"/>
  <circle cx="25"  cy="23" r="0.9" fill="white" opacity="0.55"/>
  <circle cx="10"  cy="25" r="0.8" fill="white" opacity="0.45"/>
  <circle cx="20"  cy="28" r="0.7" fill="white" opacity="0.40"/>
</svg>
